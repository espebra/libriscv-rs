[package]
name = "rvlinux"
description = "Command-line RISC-V Linux userspace emulator built on libriscv"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["jit"]
# Runs with the Cranelift JIT (and its code cache for dynamic executables)
# unless given `--no-translate`. Without it (`--no-default-features`),
# `rvlinux` only interprets, and no crate in the build has unsafe code.
jit = ["libriscv/jit"]
# The fastest interpreter (`libriscv/nightly-dispatch`); needs the pinned nightly.
nightly-dispatch = ["libriscv/nightly-dispatch"]
# Adds `--aot-save`/`--aot-save-shared`: translate the program to Rust ahead
# of time, and runs translations compiled into `rvlinux`
# (`RVLINUX_AOT_EMBED`). No unsafe code.
aot = ["libriscv/aot"]
# Adds `--aot-load`: run translations compiled into shared objects.
aot-dylib = ["aot", "libriscv/aot-dylib"]

[dependencies]
libriscv = { workspace = true, features = ["ext-a", "ext-c", "ext-f", "ext-v"] }

[lints]
workspace = true

[dev-dependencies]
testutil.workspace = true

[[bench]]
name = "coremark"
harness = false
