# Stable Rust: the library, the interpreter and the JIT. Bump deliberately
# and re-run the full test suite and benchmarks; see "Toolchain" in
# PORTING.md. The opt-in `nightly-dispatch` and `aot` features need the
# pinned nightly instead (`cargo +nightly-2026-09-28 ...`, as in
# fuzz/rust-toolchain.toml).
[toolchain]
channel = "1.98"
components = ["rustfmt", "clippy"]
# The Rust guests of the tests and examples (`testutil::build_rust`).
targets = ["riscv64gc-unknown-linux-gnu"]
