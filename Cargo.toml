[workspace]
resolver = "3"
members = [
    "crates/libriscv",
    "crates/libriscv-jit-rt",
    "crates/rvlinux",
    "crates/testutil",
    "examples/asteroids",
]
# cargo-fuzz harnesses: a separate workspace (see fuzz/README.md). The
# example game's script is built for RISC-V by the example itself.
exclude = ["fuzz", "examples/asteroids/guest"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/libriscv/libriscv-rs"

[workspace.dependencies]
# Workspace members select their ISA and JIT features explicitly.
libriscv = { path = "crates/libriscv", default-features = false }
libriscv-jit-rt = { path = "crates/libriscv-jit-rt" }
testutil = { path = "crates/testutil" }

# Enforce safe Rust throughout the workspace. `libriscv-jit-rt` defines a
# separate lint policy for executable memory, native loading, and arena mappings.
# See its Cargo.toml and the JIT section in PORTING.md.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Emulator code does a lot of deliberate integer reinterpretation; keep these
# visible in review but do not fail on them.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Catch accidental panics on guest-controlled input.
indexing_slicing = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# Optimize dependencies, including Cranelift, while keeping workspace crates
# unoptimized for debugging. This reduces static glibc JIT compilation from
# approximately 40 s to 2 s in differential tests.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
